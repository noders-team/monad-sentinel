# Declarative set of Sentinel alerts with defaults for VDP thresholds.
# Metrics verified against a live testnet node (node v0.14.5).

[[rule]]
id = "scrape_down"
severity = "critical"
for_ms = 15000
repeat_ms = 900000
vdp_link = "uptime"
message = "Scrape endpoint :8889 unavailable — node or otelcol may be down"
kind = "absent"
metric = "monad_total_uptime_us"

[[rule]]
id = "sync_stall"
severity = "critical"
for_ms = 30000
repeat_ms = 900000
vdp_link = "uptime"
message = "Block height has not advanced for 30s — node is stalled or lagging"
kind = "stale"
metric = "monad_execution_ledger_block_num"
suppressed_by = ["metrics_stale"]

[[rule]]
id = "commit_stall"
severity = "critical"
for_ms = 30000
repeat_ms = 900000
vdp_link = "performance"
message = "Commit rate < 1.5 blocks/sec (normal ~2.5)"
kind = "rate"
metric = "monad_state_consensus_events_commit_block"
op = "lt"
threshold = 1.5
window_ms = 60000
suppressed_by = ["metrics_stale"]

[[rule]]
id = "local_timeout_spike"
severity = "warning"
for_ms = 60000
repeat_ms = 3600000
vdp_link = "performance"
message = "Spike in local round timeouts (above adaptive baseline)"
kind = "adaptive_rate"
metric = "monad_state_consensus_events_local_timeout"
k = 3.0
window_ms = 60000

[[rule]]
id = "execution_lagging"
severity = "warning"
for_ms = 60000
repeat_ms = 3600000
vdp_link = "performance"
message = "Execution lagging behind consensus (rx_execution_lagging is increasing)"
kind = "rate"
metric = "monad_state_consensus_events_rx_execution_lagging"
op = "gt"
threshold = 0.0
window_ms = 60000

[[rule]]
id = "vote_delay_high"
severity = "warning"
for_ms = 60000
repeat_ms = 3600000
vdp_link = "performance"
message = "Vote delay p99 > 800ms"
kind = "threshold"
metric = "monad_state_vote_delay_ready_after_timer_start_p99_ms"
op = "gt"
value = 800.0

[[rule]]
id = "peer_loss"
severity = "warning"
for_ms = 60000
repeat_ms = 3600000
vdp_link = "network"
message = "Peer count has dropped below 40"
kind = "threshold"
metric = "monad_peer_disc_num_peers"
op = "lt"
value = 40.0

[[rule]]
id = "statesync_active"
severity = "warning"
for_ms = 60000
repeat_ms = 3600000
vdp_link = "uptime"
message = "Node entered state-sync (statesync_syncing=1) — has fallen behind the network"
kind = "threshold"
metric = "monad_statesync_syncing"
op = "ge"
value = 1.0

[[rule]]
id = "metrics_stale"
severity = "critical"
for_ms = 0
repeat_ms = 900000
vdp_link = "uptime"
message = "Metrics :8889 not updating (otel/waltrace thread may have died; zombie node). If rpc_block_stall is NOT firing, the chain is alive and only metrics are frozen → restart the node."
kind = "freshness"
max_age_ms = 60000

[[rule]]
id = "rpc_block_stall"
severity = "critical"
for_ms = 30000
repeat_ms = 900000
vdp_link = "uptime"
message = "RPC eth_blockNumber not advancing for 30s — chain/node stalled OR RPC endpoint unreachable (independent of otel)"
kind = "stale"
metric = "rpc_block_number"

[[rule]]
id = "participation_loss"
severity = "critical"
for_ms = 30000
repeat_ms = 900000
vdp_link = "uptime"
message = "Node is alive and rounds are advancing, but we are NOT voting (vote-rate < 50% of round-rate) — consensus participation lost, burning VDP uptime."
kind = "rate_ratio"
numerator = "monad_state_consensus_events_created_vote"
denominator = "monad_state_consensus_events_enter_new_round_qc"
max_ratio = 0.5
min_denominator_rate = 1.0
window_ms = 60000
suppressed_by = ["metrics_stale"]
