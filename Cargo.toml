[package]
name = "sentinel-agent"
version = "0.1.0"
edition = "2021"

[lib]
name = "sentinel_agent"
path = "src/lib.rs"

[[bin]]
name = "sentinel-agent"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
signal-hook = "0.3"
