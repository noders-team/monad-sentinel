[package]
name = "sentinel-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sentinel-web"
path = "src/main.rs"

[lib]
name = "sentinel_web"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tower-http = { version = "0.7.0", features = ["fs", "trace"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }
